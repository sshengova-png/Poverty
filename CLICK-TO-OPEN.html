<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="1; url=index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Gallery</title>
    <style>
      :root {
        color: #26162f;
        font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
        background: #fff8e8;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        text-align: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(244, 195, 77, 0.35), transparent 20rem),
          radial-gradient(circle at 80% 15%, rgba(165, 55, 146, 0.25), transparent 22rem),
          linear-gradient(135deg, #fff8e8, #eafbe9);
      }

      main {
        width: min(680px, calc(100% - 2rem));
        padding: 2rem;
        border: 4px solid #26162f;
        border-radius: 30px 24px 36px 26px;
        background: rgba(255, 253, 245, 0.88);
        box-shadow: 10px 12px 0 rgba(38, 22, 47, 0.12);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        line-height: 0.95;
      }

      p {
        color: #6d5a73;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        justify-content: center;
        margin-top: 1rem;
        padding: 0.9rem 1.25rem;
        border: 3px solid #26162f;
        border-radius: 24px 30px 22px 28px;
        color: #26162f;
        background: #f4c34d;
        box-shadow: 6px 7px 0 rgba(142, 96, 18, 0.28);
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening Gallery...</h1>
      <p>
        If it does not open automatically, click the big yellow button below.
      </p>
      <a href="index.html">Open Gallery</a>
    </main>
  </body>
</html>
